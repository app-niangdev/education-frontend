<div>
  <!-- Header -->
  <div class="flex items-center px-6 py-4 border-b">
    <div
      class="w-10 h-10 rounded-full bg-primary-600/10 text-primary-600 flex items-center justify-center ltr:mr-3 rtl:ml-3 flex-none">
      <mat-icon svgIcon="mat:person"></mat-icon>
    </div>
    <div class="flex-auto">
      <h2 mat-dialog-title class="text-xl font-semibold m-0">
        {{ isChange ? "Changer l'enseignant" : 'Affecter un enseignant' }}
      </h2>
      <p class="m-0 caption text-hint">
        {{ data.classeMatiere.matiere?.nom }} &bull; Classe {{ data.classeNom }}
      </p>
    </div>
  </div>

  <!-- Content -->
  <mat-dialog-content class="px-6 py-4">

    <div *ngIf="loadingRefs" class="flex flex-col items-center justify-center gap-4 py-8">
      <mat-spinner diameter="40"></mat-spinner>
      <p class="m-0 caption text-hint">Chargement des enseignants...</p>
    </div>

    <form *ngIf="!loadingRefs" [formGroup]="form" class="flex flex-col gap-4">

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Enseignant</mat-label>
        <mat-icon matPrefix svgIcon="mat:account_circle" class="mr-2 text-hint icon-sm"></mat-icon>
        <mat-select formControlName="enseignant_id">
          <mat-option *ngFor="let e of enseignants" [value]="e.id">
            {{ enseignantLabel(e) }}
          </mat-option>
        </mat-select>
        <mat-hint *ngIf="enseignants.length === 0">
          Aucun enseignant enregistré.
        </mat-hint>
        <mat-error *ngIf="form.get('enseignant_id')?.hasError('required')">
          L'enseignant est obligatoire
        </mat-error>
      </mat-form-field>

    </form>
  </mat-dialog-content>

  <!-- Actions -->
  <mat-dialog-actions class="px-6 py-4 border-t flex justify-end gap-3">
    <button mat-stroked-button type="button" (click)="onCancel()" [disabled]="loading">
      Annuler
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onSubmit()"
      [disabled]="!canSubmit">
      <ng-container *ngIf="!loading">
        <mat-icon svgIcon="mat:save" class="ltr:mr-2 rtl:ml-2 icon-sm"></mat-icon>
        {{ isChange ? 'Changer' : 'Affecter' }}
      </ng-container>
      <ng-container *ngIf="loading">
        <mat-spinner diameter="16" class="ltr:mr-2 rtl:ml-2"></mat-spinner>
        Enregistrement...
      </ng-container>
    </button>
  </mat-dialog-actions>
</div>
