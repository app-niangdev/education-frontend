<div @fadeInUp class="flex flex-col items-center justify-center min-h-screen bg-gray-50 dark:bg-gray-900 p-6">
  <div class="text-center max-w-md">
    <div class="flex justify-center mb-6">
      <mat-icon class="text-red-500" svgIcon="mat:lock" style="font-size: 80px; width: 80px; height: 80px;"></mat-icon>
    </div>

    <h1 class="text-6xl font-bold text-gray-800 dark:text-gray-100 mb-2">403</h1>
    <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-300 mb-4">Accès non autorisé</h2>
    <p class="text-gray-500 dark:text-gray-400 mb-8">
      Vous n'avez pas les permissions nécessaires pour accéder à cette page.
    </p>

    <button mat-flat-button color="primary" (click)="goBack()">
      <mat-icon class="mr-2" svgIcon="mat:home"></mat-icon>
      Retourner à l'accueil
    </button>
  </div>
</div>
