<div class="w-full h-full flex flex-col">
  <!-- En-tête de page -->
  <div class="px-6 pt-6 pb-10 bg-primary-600/10 flex-none">
    <div class="flex items-center container px-0 gap-3">
      <!-- Bouton retour optionnel, avant le titre -->
      <ng-content select="[retour]"></ng-content>
      <h2 class="display-1 font-bold m-0 flex items-center w-full">
        <span @scaleIn
          class="w-12 h-12 rounded-full text-primary-600 ltr:mr-4 rtl:ml-4 bg-primary-600/10 hidden sm:flex items-center justify-center">
          <mat-icon [svgIcon]="icon"></mat-icon>
        </span>
        <span @fadeInRight class="block">{{ titre }}</span>
      </h2>
      <div class="flex items-center gap-3 flex-none">
        <ng-content select="[entete]"></ng-content>
      </div>
    </div>
  </div>

  <div class="container-fluid px-6">
    <div class="mt-6 flex flex-col gap-6">
      <!-- Contenu libre au-dessus de la liste (bannière, alerte…) -->
      <ng-content select="[avant]"></ng-content>

      <div class="card">
        <!-- Barre d'outils -->
        <div class="px-6 py-4 border-b flex flex-col gap-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div *ngIf="titreCarte || sousTitre">
              <h2 class="title m-0" *ngIf="titreCarte">{{ titreCarte }}</h2>
              <p class="m-0 caption text-hint" *ngIf="sousTitre">{{ sousTitre }}</p>
            </div>
            <div class="flex items-center gap-3 flex-none">
              <ng-content select="[actions]"></ng-content>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-4 flex-wrap"
            [class.hidden]="!aDesFiltres">
            <ng-content select="[filtres]"></ng-content>
          </div>
        </div>

        <!-- Contenu libre entre la barre d'outils et la liste (bandeaux) -->
        <ng-content select="[avantListe]"></ng-content>

        <!-- Chargement -->
        <div *ngIf="loading" class="flex flex-col items-center justify-center gap-4 p-12">
          <mat-spinner diameter="48"></mat-spinner>
          <p class="m-0 text-hint">Chargement en cours…</p>
        </div>

        <ng-container *ngIf="!loading">
          <!-- Lignes : cartes espacées sur mobile, séparateurs sur desktop -->
          <div class="flex flex-col gap-3 p-4 lg:gap-0 lg:p-0 lg:divide-y" *ngIf="!vide">
            <ng-content></ng-content>
          </div>

          <!-- État vide -->
          <div *ngIf="vide">
            <ng-content select="[etatVide]"></ng-content>
          </div>

          <!-- Pagination -->
          <mat-paginator *ngIf="!vide && meta"
            [length]="meta.total"
            [pageSize]="meta.per_page"
            [pageIndex]="meta.current_page - 1"
            [pageSizeOptions]="pageSizeOptions"
            (page)="pageChange.emit($event)"
            showFirstLastButtons>
          </mat-paginator>
        </ng-container>
      </div>
    </div>
  </div>
</div>
